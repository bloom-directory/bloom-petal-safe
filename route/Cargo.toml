[package]
name = "safe-route"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["std", "k256"] }
alloy-sol-types = { version = "=1.6.1", default-features = false, features = ["std", "json"] }
hex = "0.4"
petal = { package = "bloom-petal-sdk", git = "https://github.com/bloom-directory/petal", rev = "61938d0c127cfe03c7e3e55baed0ba1439bc5ca2" }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
